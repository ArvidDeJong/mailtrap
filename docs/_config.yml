title: darvis/mailtrap
description: Unofficial Mailtrap integration for Laravel. Checks recipients before sending (format and MX), logs every outgoing mail, processes signed Mailtrap webhook events and adds an inbox page.
url: https://arviddejong.github.io
baseurl: /mailtrap

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap

# Facts about the package, used by the structured data and llms.txt.
package:
  name: darvis/mailtrap
  repository: https://github.com/ArvidDeJong/mailtrap
  packagist: https://packagist.org/packages/darvis/mailtrap
  license_url: https://github.com/ArvidDeJong/mailtrap/blob/main/LICENSE
  requires: PHP 8.2+, Laravel 11, 12 or 13; Livewire ^3.7.4 or ^4.0 and Flux ^2.11 only for the inbox UI
  platforms: [Laravel]
  keywords: [laravel, mailtrap, laravel mailtrap, email validation, mx check, mail log, email logging, mailtrap webhook, webhook signature, bounce handling, livewire]

# Developer credit in the footer and the structured data.
developer:
  company: ARVID.NL
  url: https://arvid.nl

color_scheme: light
search_enabled: true
heading_anchors: true

aux_links:
  GitHub: https://github.com/ArvidDeJong/mailtrap
  Packagist: https://packagist.org/packages/darvis/mailtrap
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/ArvidDeJong/mailtrap
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/social-preview.png
