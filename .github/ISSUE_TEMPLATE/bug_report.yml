name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problem, such as an unsigned webhook call being accepted? Please report it privately instead: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? Include the error message if there is one.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The code that sends the mail or calls the package, and the relevant config, trimmed to the smallest example that fails. Leave out tokens and secrets.
      render: php
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: "1.4.1"
    validations:
      required: true
  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
      placeholder: "13.0"
    validations:
      required: true
  - type: input
    id: mailer
    attributes:
      label: Mailer
      description: The MAIL_MAILER in use, and whether you send through Mailtrap.
      placeholder: smtp (Mailtrap)
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.4"
    validations:
      required: true
